<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />

    <title>CARVO — Administration</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,300..700;1,8..60,400&family=Frank+Ruhl+Libre:wght@300..700&display=swap"
      rel="stylesheet"
    />

    <script type="module" src="/src/auth-guard.js"></script>

    <style>
      :root {
        --paper: #fcfcfb;
        --wash: #f9f9f7;
        --ink: #2e2c27;
        --soft: #6b6a63;
        --grey: #b4b3a8;
        --hair: #e4e3dc;
        --clay: #c6613f;
        --clay-h: #ae5133;
        --tint: #f6eae4;
        --green: #68765f;
        --amber: #9a7847;
        --danger: #9c3d32;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: "Source Serif 4", Georgia, serif;
      }

      button,
      input,
      textarea,
      select {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      a {
        text-decoration: none;
        color: inherit;
      }

      .app {
        min-height: 100vh;
      }

      .top {
        height: 58px;
        border-bottom: 1px solid var(--hair);
        display: flex;
        align-items: center;
        padding: 0 26px;
        gap: 18px;
        position: sticky;
        top: 0;
        background: var(--paper);
        z-index: 20;
      }

      .brand {
        font-size: 20px;
        font-weight: 600;
        letter-spacing: 0.16em;
      }

      .role {
        font-size: 11px;
        color: var(--grey);
        letter-spacing: 0.08em;
      }

      .topRight {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .lang {
        border: 1px solid var(--hair);
        background: none;
        border-radius: 7px;
        padding: 5px 11px;
        color: var(--soft);
        font-size: 12px;
      }

      .user {
        padding-left: 12px;
        border-left: 1px solid var(--hair);
        font-size: 13px;
      }

      .layout {
        display: flex;
        min-height: calc(100vh - 58px);
      }

      .side {
        width: 254px;
        border-right: 1px solid var(--hair);
        padding: 26px 12px 20px;
        position: sticky;
        top: 58px;
        height: calc(100vh - 58px);
        overflow: auto;
        flex-shrink: 0;
      }

      .sideIntro {
        padding: 0 12px 26px;
      }

      .sideIntro b {
        font-size: 13px;
        font-weight: 600;
      }

      .sideIntro div {
        font-size: 11px;
        color: var(--grey);
        margin-top: 3px;
      }

      .navGroup {
        margin: 0 0 23px;
      }

      .navLabel {
        font-size: 10px;
        letter-spacing: 0.12em;
        color: var(--grey);
        padding: 0 12px 8px;
      }

      .nav a {
        display: flex;
        justify-content: space-between;
        padding: 8px 12px;
        border-radius: 7px;
        color: var(--soft);
        font-size: 14px;
        margin: 1px 0;
      }

      .nav a:hover,
      .nav a.active {
        background: var(--wash);
        color: var(--ink);
      }

      .nav a.active {
        font-weight: 600;
      }

      .badge {
        color: var(--clay);
        font-size: 11px;
      }

      .main {
        flex: 1;
        min-width: 0;
        padding: 38px 52px 70px;
        max-width: 1450px;
      }

      .eyebrow {
        font-size: 10.5px;
        letter-spacing: 0.12em;
        color: var(--grey);
        text-transform: uppercase;
      }

      .title {
        font-size: 34px;
        line-height: 1.18;
        margin: 7px 0 7px;
        font-weight: 600;
      }

      .sub {
        font-size: 14px;
        color: var(--soft);
        line-height: 1.7;
        max-width: 760px;
      }

      .headRow {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 20px;
        margin-bottom: 30px;
      }

      .actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .btn {
        border: 1px solid var(--hair);
        background: var(--paper);
        border-radius: 7px;
        padding: 9px 14px;
        font-size: 13px;
        color: var(--soft);
      }

      .btn:hover {
        border-color: var(--ink);
        color: var(--ink);
      }

      .btn.primary {
        background: var(--clay);
        border-color: var(--clay);
        color: white;
      }

      .btn.primary:hover {
        background: var(--clay-h);
      }

      .btn:disabled {
        opacity: 0.55;
        cursor: wait;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 1px;
        border-top: 1px solid var(--hair);
        border-bottom: 1px solid var(--hair);
        margin-bottom: 34px;
      }

      .stat {
        padding: 20px 18px;
        border-right: 1px solid var(--hair);
      }

      .stat:last-child {
        border: 0;
      }

      .stat .n {
        font-size: 30px;
      }

      .stat .l {
        font-size: 12px;
        color: var(--soft);
        margin-top: 4px;
      }

      .stat .hint {
        font-size: 11px;
        color: var(--clay);
        margin-top: 7px;
      }

      .section {
        margin: 34px 0;
      }

      .sectionHead {
        display: flex;
        align-items: end;
        justify-content: space-between;
        margin-bottom: 14px;
      }

      .sectionHead h2 {
        font-size: 20px;
        margin: 0;
        font-weight: 600;
      }

      .muted {
        font-size: 12px;
        color: var(--grey);
      }

      .table {
        border-top: 1px solid var(--hair);
      }

      .tr {
        display: grid;
        grid-template-columns: 2.1fr 1.1fr 0.9fr 1fr 90px;
        gap: 18px;
        align-items: center;
        padding: 14px 4px;
        border-bottom: 1px solid var(--hair);
        font-size: 13px;
      }

      .tr.head {
        font-size: 10.5px;
        letter-spacing: 0.08em;
        color: var(--grey);
        text-transform: uppercase;
      }

      .status {
        font-size: 11px;
        padding: 4px 8px;
        border-radius: 20px;
        display: inline-block;
        background: var(--wash);
        color: var(--soft);
      }

      .status.ready {
        color: var(--green);
      }

      .status.review {
        color: var(--clay);
        background: var(--tint);
      }

      .status.processing {
        color: var(--amber);
      }

      .status.failed {
        color: var(--danger);
      }

      .rowTitle {
        font-weight: 600;
      }

      .rowMeta {
        font-size: 11.5px;
        color: var(--grey);
        margin-top: 3px;
      }

      .notice {
        border-inline-start: 3px solid var(--clay);
        background: var(--wash);
        padding: 16px 18px;
        margin: 20px 0;
        font-size: 13px;
        line-height: 1.7;
      }

      .notice.error {
        border-inline-start-color: var(--danger);
        color: var(--danger);
      }

      .notice.success {
        border-inline-start-color: var(--green);
      }

      .source {
        border: 1px solid var(--hair);
        padding: 18px;
        background: var(--paper);
      }

      .source small {
        color: var(--grey);
        font-size: 11px;
      }

      .source strong {
        display: block;
        margin: 6px 0;
      }

      .quote {
        border-left: 2px solid var(--hair);
        padding-left: 14px;
        color: var(--soft);
        line-height: 1.8;
      }

      .cards {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 18px;
      }

      .card {
        border: 1px solid var(--hair);
        padding: 18px;
        background: var(--paper);
      }

      .card h3 {
        margin: 0 0 8px;
        font-size: 16px;
      }

      .card p {
        margin: 0;
        color: var(--soft);
        font-size: 13px;
        line-height: 1.65;
      }

      .toolbar {
        display: flex;
        gap: 9px;
        align-items: center;
        margin-bottom: 14px;
      }

      .search {
        flex: 1;
        border: 1px solid var(--hair);
        border-radius: 7px;
        padding: 9px 12px;
        background: var(--paper);
        font-size: 13px;
        color: var(--ink);
        outline: none;
      }

      .search:focus {
        border-color: var(--clay);
      }

      .select {
        border: 1px solid var(--hair);
        border-radius: 7px;
        padding: 9px 12px;
        background: var(--paper);
        color: var(--soft);
        font-size: 13px;
        outline: none;
      }

      .empty {
        border-top: 1px solid var(--hair);
        border-bottom: 1px solid var(--hair);
        padding: 54px 20px;
        text-align: center;
        color: var(--soft);
      }

      .empty b {
        display: block;
        color: var(--ink);
        font-size: 18px;
        margin-bottom: 7px;
      }

      .detail {
        max-width: 930px;
      }

      .detailGrid {
        display: grid;
        grid-template-columns: 1fr 310px;
        gap: 30px;
      }

      .field {
        margin: 18px 0;
      }

      .field label {
        display: block;
        font-size: 11px;
        letter-spacing: 0.08em;
        color: var(--grey);
        text-transform: uppercase;
        margin-bottom: 7px;
      }

      .textarea {
        width: 100%;
        min-height: 150px;
        border: 1px solid var(--hair);
        border-radius: 7px;
        padding: 12px;
        resize: vertical;
        background: var(--paper);
        line-height: 1.7;
        outline: none;
      }

      .textarea:focus {
        border-color: var(--clay);
      }

      .reviewBlock {
        border-top: 1px solid var(--hair);
        padding: 18px 0;
      }

      .reviewBlock h3 {
        font-size: 17px;
        margin: 0 0 8px;
      }

      .reviewBlock p {
        font-size: 13px;
        line-height: 1.7;
        color: var(--soft);
        margin: 0;
      }

      .sidePanel {
        border-left: 1px solid var(--hair);
        padding-left: 22px;
      }

      .sidePanel h3 {
        font-size: 15px;
        margin-top: 0;
      }

      .kv {
        display: flex;
        justify-content: space-between;
        gap: 15px;
        border-bottom: 1px solid var(--hair);
        padding: 9px 0;
        font-size: 12.5px;
      }

      .kv span:last-child {
        color: var(--soft);
        text-align: right;
        word-break: break-word;
      }

      .loading {
        padding: 34px 4px;
        color: var(--soft);
        font-size: 13px;
      }

      .loading::before {
        content: "";
        display: inline-block;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--clay);
        margin-right: 8px;
        animation: pulse 1s infinite alternate;
      }

      @keyframes pulse {
        from {
          opacity: 0.3;
        }

        to {
          opacity: 1;
        }
      }

      .toast {
        position: fixed;
        right: 22px;
        bottom: 22px;
        background: var(--ink);
        color: var(--paper);
        padding: 11px 15px;
        border-radius: 7px;
        font-size: 12.5px;
        opacity: 0;
        transform: translateY(8px);
        pointer-events: none;
        transition: 0.2s;
        z-index: 100;
        max-width: 360px;
      }

      .toast.show {
        opacity: 1;
        transform: none;
      }

      .overlay {
        position: fixed;
        inset: 0;
        background: rgba(46, 44, 39, 0.18);
        z-index: 50;
        display: none;
      }

      .drawer {
        position: absolute;
        right: 0;
        top: 0;
        height: 100%;
        width: min(620px, 94vw);
        background: var(--paper);
        padding: 28px;
        overflow: auto;
        border-left: 1px solid var(--hair);
      }

      .overlay.open {
        display: block;
      }

      .drawerHeader {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 20px;
        margin-bottom: 24px;
      }

      .drawerHeader h2 {
        margin: 5px 0;
        font-size: 25px;
      }

      .version {
        border: 1px solid var(--hair);
        padding: 14px;
        margin-top: 12px;
      }

      .versionTitle {
        font-weight: 600;
        font-size: 14px;
      }

      .versionMeta {
        color: var(--grey);
        font-size: 11px;
        margin-top: 4px;
      }

      .versionContent {
        color: var(--soft);
        font-size: 13px;
        line-height: 1.7;
        margin-top: 12px;
        white-space: pre-wrap;
      }

      .fileInput {
        width: 100%;
        border: 1px dashed var(--hair);
        padding: 18px;
        border-radius: 7px;
        background: var(--wash);
      }

      .fileInput input {
        width: 100%;
        margin-top: 10px;
      }

      @media (max-width: 1000px) {
        .side {
          width: 220px;
        }

        .main {
          padding: 30px;
        }

        .grid {
          grid-template-columns: repeat(2, 1fr);
        }

        .cards {
          grid-template-columns: 1fr 1fr;
        }

        .detailGrid {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 720px) {
        .side {
          display: none;
        }

        .main {
          padding: 24px 18px;
        }

        .grid,
        .cards {
          grid-template-columns: 1fr;
        }

        .tr {
          grid-template-columns: 1.5fr 0.8fr 80px;
        }

        .tr > *:nth-child(3),
        .tr > *:nth-child(4) {
          display: none;
        }

        .top {
          padding: 0 16px;
        }

        .user {
          display: none;
        }

        .headRow {
          display: block;
        }

        .actions {
          margin-top: 15px;
        }

        .toolbar {
          flex-direction: column;
          align-items: stretch;
        }
      }

      .signout {
        background: var(--danger);
        border: 1px solid var(--danger);
        color: white;
        border-radius: 7px;
        padding: 5px 11px;
        font-size: 12px;
        cursor: pointer;
      }

      .signout:hover {
        background: #7a3228;
      }
    </style>
  </head>

  <body>
    <div id="app"></div>

    <div id="toast" class="toast"></div>

    <div id="overlay" class="overlay" onclick="closeDrawer()">
      <div id="drawer" class="drawer" onclick="event.stopPropagation()"></div>
    </div>

    <script type="module">
      import {
        getAdminDashboard,
        getDocuments,
        getDocument,
        createDocument,
        createDocumentVersion,
        updateDocumentStatus,
        getKnowledge,
        getKnowledgeById,
        createKnowledge,
        updateKnowledge,
        deleteKnowledge,
        getReviews,
        getReview,
        createReview,
        updateReview,
        answerClarification,
        requestReviewChanges,
        approveReview,
        rejectReview,
        getProtocols,
        getProtocol,
        createProtocol,
        updateProtocol,
        updateProtocolStatus,
        createProtocolVersion,
        getProtocolVersions,
        linkKnowledge,
        unlinkKnowledge,
        getVersions,
        getAnalyses,
        getAnalysis,
        getAiJobs,
        getAiJob,
        getUsers,
        getUser,
        createUser,
        updateUser,
        getAuditLogs,
        getAuditLog,
        getSettings,
        getNotifications,
        getUnreadNotificationCount,
        markNotificationAsRead,
        markAllNotificationsAsRead,
      } from "/src/api/admin.api.js";
      import { getCurrentUser } from "/src/api/client.js";

      const user = getCurrentUser();
      const state = {
        page: "dashboard",
        loading: false,
        error: "",
        search: "",
        docStatus: "ALL",
        knowledgeStatus: "ALL",
        knowledgeType: "ALL",
        reviewStatus: "ALL",
        documents: [],
        knowledge: [],
        reviews: [],
        protocols: [],
        versions: { documents: [], protocols: [], knowledge: [] },
        analyses: [],
        aiJobs: [],
        users: [],
        auditLogs: [],
        notifications: [],
        unreadNotifications: 0,
        dashboard: null,
        settings: null,
      };

      const KNOWLEDGE_TYPES = [
        "DEFINITION",
        "PRINCIPLE",
        "CONDITION",
        "ACTION",
        "RELATIONSHIP",
        "RULE",
        "OTHER",
      ];
      const REVIEW_STATUSES = [
        "PENDING",
        "IN_REVIEW",
        "CLARIFICATION_REQUIRED",
        "CHANGES_REQUESTED",
        "APPROVED",
        "REJECTED",
      ];
      const PROTOCOL_STATUSES = ["DRAFT", "ACTIVE", "ARCHIVED"];
      const DOCUMENT_STATUSES = [
        "UPLOADED",
        "PROCESSING",
        "PROCESSED",
        "FAILED",
        "ARCHIVED",
      ];
      const USER_ROLES = ["ADMIN", "MINISTER", "REVIEWER"];

      const esc = (v) =>
        String(v ?? "").replace(
          /[&<>"']/g,
          (m) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#039;",
            })[m],
        );
      const fmtDate = (v) => {
        if (!v) return "—";
        const d = new Date(v);
        return Number.isNaN(d.getTime())
          ? String(v)
          : d.toLocaleDateString(undefined, {
              year: "numeric",
              month: "short",
              day: "numeric",
            });
      };
      const fmtDateTime = (v) => {
        if (!v) return "—";
        const d = new Date(v);
        return Number.isNaN(d.getTime())
          ? String(v)
          : d.toLocaleString(undefined, {
              year: "numeric",
              month: "short",
              day: "numeric",
              hour: "2-digit",
              minute: "2-digit",
            });
      };
      const statusClass = (s) => {
        s = String(s || "").toUpperCase();
        return ["PROCESSING", "QUEUED", "IN_PROGRESS"].includes(s)
          ? "processing"
          : ["FAILED", "CANCELLED", "REJECTED"].includes(s)
            ? "failed"
            : [
                  "REVIEW",
                  "DRAFT",
                  "PENDING",
                  "IN_REVIEW",
                  "CLARIFICATION_REQUIRED",
                  "CHANGES_REQUESTED",
                ].includes(s)
              ? "review"
              : "ready";
      };
      const prettyJson = (v) => {
        try {
          return JSON.stringify(v ?? [], null, 2);
        } catch {
          return String(v ?? "");
        }
      };
      function toast(m) {
        const e = document.getElementById("toast");
        e.textContent = m;
        e.classList.add("show");
        clearTimeout(window.__t);
        window.__t = setTimeout(() => e.classList.remove("show"), 2800);
      }
      function fail(e) {
        state.error = e?.message || "Unable to load administration data.";
        console.error("[CARVO Admin]", e);
      }
      function clearFail() {
        state.error = "";
      }
      function openDrawer() {
        document.getElementById("overlay").classList.add("open");
      }
      function closeDrawer() {
        document.getElementById("overlay").classList.remove("open");
      }
      window.closeDrawer = closeDrawer;

      function nav() {
        const base = [
          ["MAIN", "Dashboard", "dashboard"],
          ["KNOWLEDGE", "Documents", "documents"],
          ["", "Knowledge Library", "knowledge"],
          ["", "Upload Knowledge", "upload"],
          ["", "AI Reviews", "reviews"],
          ["", "Protocols", "protocols"],
          ["", "Versions", "versions"],
          ["WORK", "Analyses", "analyses"],
        ];
        if (user?.role === "ADMIN")
          base.push(
            ["ADMINISTRATION", "Users", "users"],
            ["", "Activity / Audit", "audit"],
            ["", "Notifications", "notifications"],
            ["SYSTEM", "Settings", "settings"],
          );
        else base.push(["ACCOUNT", "Notifications", "notifications"]);
        return base;
      }
      function groupedNav() {
        let last = "",
          o = "";
        for (const [g, l, id] of nav()) {
          if (g && g !== last) {
            if (last) o += "</div>";
            o += `<div class="navGroup"><div class="navLabel">${esc(g)}</div>`;
            last = g;
          }
          const b =
            id === "notifications" && state.unreadNotifications
              ? `<span class="badge">${state.unreadNotifications}</span>`
              : "";
          o += `<a href="#" class="${state.page === id ? "active" : ""}" onclick="go('${id}');return false"><span>${esc(l)}</span>${b}</a>`;
        }
        if (last) o += "</div>";
        return o;
      }
      function header(e, t, d, a = "") {
        return `<div class="headRow"><div><div class="eyebrow">${esc(e)}</div><h1 class="title">${esc(t)}</h1><div class="sub">${esc(d)}</div></div><div class="actions">${a}</div></div>`;
      }
      function errorNotice() {
        return state.error
          ? `<div class="notice error"><strong>Unable to load live data</strong><div style="margin-top:5px">${esc(state.error)}</div><div style="margin-top:12px"><button class="btn" onclick="refreshCurrentPage()">Try again</button></div></div>`
          : "";
      }
      function button(label, fn, primary = false) {
        return `<button class="btn${primary ? " primary" : ""}" type="button" onclick="${fn}">${esc(label)}</button>`;
      }

      function signOut() {
        localStorage.removeItem('carvo_token');
        localStorage.removeItem('carvo_user');
        window.location.href = '/login.html';
      }
      window.signOut = signOut;

      function render() {
        document.getElementById("app").innerHTML =
          `<div class="app"><header class="top"><div class="brand">CARVO</div><div class="role">ADMINISTRATION · ${esc(user?.role || "ADMIN")}</div><div class="topRight"><button class="lang">עברית</button><button class="lang">English</button><div class="user">${esc(user?.name || user?.email || "Administrator")} · ${esc(user?.role || "ADMIN")}</div><button class="signout" onclick="signOut()">Sign Out</button></div></header><div class="layout"><aside class="side"><div class="sideIntro"><b>Knowledge · Analysis · Action</b></div><nav class="nav">${groupedNav()}</nav></aside><main class="main">${page()}</main></div></div>`;
      }
      function page() {
        switch (state.page) {
          case "dashboard":
            return dashboard();
          case "documents":
            return documents();
          case "knowledge":
            return knowledgePage();
          case "upload":
            return upload();
          case "reviews":
            return reviews();
          case "protocols":
            return protocolsPage();

          d.innerHTML = `<div class="drawerHeader"><div><div class="eyebrow">PROTOCOL</div><h2>${esc(p.name)}</h2></div>${button("Close", "closeDrawer()")}</div><div class="kv"><span>Status</span><span>${esc(p.status)}</span></div><div class="kv"><span>Created</span><span>${fmtDateTime(p.createdAt)}</span></div><div class="kv"><span>Updated</span><span>${fmtDateTime(p.updatedAt)}</span></div><div class="reviewBlock"><h3>Edit protocol</h3><input class="search" id="protocolEditName" value="${esc(p.name)}"><textarea class="textarea" id="protocolEditDescription">${esc(p.description || "")}</textarea><br>${button("Save", "saveProtocol('" + esc(id) + "')", true)} <select class="select" id="protocolStatusEdit">${PROTOCOL_STATUSES.map((s) => `<option ${p.status === s ? "selected" : ""}>${s}</option>`).join("")}</select>${button("Save status", "saveProtocolStatus('" + esc(id) + "')")}</div><div class="reviewBlock"><h3>New version</h3><textarea class="textarea" id="protocolVersionContent" placeholder="Protocol version content"></textarea><br>${button("Create version", "saveProtocolVersion('" + esc(id) + "')", true)}</div><div class="reviewBlock"><h3>Versions</h3>${
            vs
              .map(
                (v) =>
                  `<div class="version"><div class="versionTitle">Version ${esc(v.version)}</div><div class="versionMeta">${fmtDateTime(v.createdAt)}</div><div class="versionContent">${esc(v.content || "")}</div><div class="rowMeta">Knowledge links: ${(v.knowledgeLinks || []).length}</div>${(v.knowledgeLinks || []).map((l) => `<div style="margin-top:6px">${esc(l.knowledgeItem?.title || l.knowledgeItemId)} ${button("Unlink", "unlinkKnowledgeUi('" + esc(id) + "','" + esc(v.id) + "','" + esc(l.knowledgeItem?.id || l.knowledgeItemId) + "')")}</div>`).join("")}<div style="margin-top:10px"><select class="select" id="linkKnowledge_${esc(v.id)}"><option value="">Select approved knowledge…</option>${state.knowledge
                    .filter((k) => k.approvalStatus === "APPROVED")
                    .map(
                      (k) =>
                        `<option value="${esc(k.id)}">${esc(k.title)}</option>`,
                    )
                    .join(
                      "",
                    )}</select> ${button("Link", "linkKnowledgeUi('" + esc(id) + "','" + esc(v.id) + "')")}</div></div>`,
              )
              .join("") || '<div class="empty">No versions.</div>'
          }</div>`;
        } catch (e) {
          d.innerHTML = `<div class="notice error">${esc(e?.message || "Unable to load protocol.")}</div>`;
        }
      };
      window.saveProtocol = async (id) => {
        try {
          await updateProtocol(id, {
            name: document.getElementById("protocolEditName").value.trim(),
            description:
              document.getElementById("protocolEditDescription").value.trim() ||
              null,
          });
          toast("Protocol updated.");
          await loadAll();
          await openProtocol(id);
        } catch (e) {
          toast(e?.message || "Unable to update protocol.");
        }
      };
      window.saveProtocolStatus = async (id) => {
        try {
          await updateProtocolStatus(
            id,
            document.getElementById("protocolStatusEdit").value,
          );
          toast("Protocol status updated.");
          await loadAll();
          await openProtocol(id);
        } catch (e) {
          toast(e?.message || "Unable to update protocol status.");
        }
      };
      window.linkKnowledgeUi = async (protocolId, versionId, knowledgeId) => {
        const select = document.getElementById("linkKnowledge_" + versionId);
        const kid = knowledgeId || select?.value;
        if (!kid) return toast("Select approved knowledge first.");
        try {
          await linkKnowledge(protocolId, versionId, kid);
          toast("Knowledge linked.");
          await loadAll();
          await openProtocol(protocolId);
        } catch (e) {
          toast(e?.message || "Unable to link knowledge.");
        }
      };
      window.unlinkKnowledgeUi = async (protocolId, versionId, knowledgeId) => {
        try {
          await unlinkKnowledge(protocolId, versionId, knowledgeId);
          toast("Knowledge unlinked.");
          await loadAll();
          await openProtocol(protocolId);
        } catch (e) {
          toast(e?.message || "Unable to unlink knowledge.");
        }
      };
      window.saveProtocolVersion = async (id) => {
        const c = document
          .getElementById("protocolVersionContent")
          .value.trim();
        if (!c) return toast("Version content is required.");
        try {
          await createProtocolVersion(id, c);
          toast("Protocol version created.");
          await loadAll();
          await openProtocol(id);
        } catch (e) {
          toast(e?.message || "Unable to create protocol version.");
        }
      };

      function versions() {
        const d = state.versions?.documents || [],
          p = state.versions?.protocols || [],
          k = state.versions?.knowledge || [];
        return (
          header(
            "KNOWLEDGE",
            "Knowledge & Protocol Versions",
            "Version records returned directly by the administration API.",
            button("Refresh", "refreshCurrentPage()"),
          ) +
          `<div class="section"><div class="sectionHead"><h2>Document versions</h2><span class="muted">${d.length}</span></div>${d.length ? `<div class="table"><div class="tr head"><div>Document</div><div>Version</div><div>Created</div><div>Content</div><div></div></div>${d.map((v) => `<div class="tr"><div>${esc(v.document?.title || v.documentId)}</div><div>v${esc(v.version)}</div><div>${fmtDateTime(v.createdAt)}</div><div>${esc((v.content || "").slice(0, 100))}</div><div></div></div>`).join("")}</div>` : '<div class="empty">No document versions.</div>'}</div><div class="section"><div class="sectionHead"><h2>Protocol versions</h2><span class="muted">${p.length}</span></div>${p.length ? `<div class="table"><div class="tr head"><div>Protocol</div><div>Version</div><div>Status</div><div>Created</div><div></div></div>${p.map((v) => `<div class="tr"><div>${esc(v.protocol?.name || v.protocolId)}</div><div>v${esc(v.version)}</div><div>${esc(v.protocol?.status || "—")}</div><div>${fmtDateTime(v.createdAt)}</div><div></div></div>`).join("")}</div>` : '<div class="empty">No protocol versions.</div>'}</div><div class="section"><div class="sectionHead"><h2>Knowledge records</h2><span class="muted">${k.length}</span></div>${k.length ? `<div class="table"><div class="tr head"><div>Knowledge</div><div>Type</div><div>Approval</div><div>Updated</div><div></div></div>${k.map((x) => `<div class="tr"><div>${esc(x.title)}</div><div>${esc(x.type)}</div><div>${esc(x.approvalStatus)}</div><div>${fmtDateTime(x.updatedAt)}</div>${button("View", "openKnowledge('" + esc(x.id) + "')")}</div>`).join("")}</div>` : '<div class="empty">No knowledge records.</div>'}</div>`
        );
      }
      window.openKnowledge = async (id) => {
        openDrawer();
        const d = document.getElementById("drawer");
        try {
          const k = await getKnowledgeById(id);
          d.innerHTML = `<div class="drawerHeader"><div><div class="eyebrow">KNOWLEDGE</div><h2>${esc(k.title)}</h2></div>${button("Close", "closeDrawer()")}</div><div class="kv"><span>Type</span><span>${esc(k.type)}</span></div><div class="kv"><span>Approval</span><span>${esc(k.approvalStatus)}</span></div><div class="kv"><span>Source</span><span>${esc(k.sourceRef || "—")}</span></div><div class="reviewBlock"><h3>Content</h3><div class="source"><div class="quote">${esc(k.content)}</div></div></div>`;
        } catch (e) {
          d.innerHTML = `<div class="notice error">${esc(e?.message || "Unable to load knowledge.")}</div>`;
        }
      };

      function analysesPage() {
        return (
          header(
            "WORK",
            "Analyses",
            "System-wide analysis records and asynchronous AI jobs available to knowledge administrators.",
            button("Refresh", "refreshCurrentPage()"),
          ) +
          `<div class="section"><div class="sectionHead"><h2>Analyses</h2><span class="muted">${state.analyses.length}</span></div>${state.analyses.length ? `<div class="table"><div class="tr head"><div>Situation</div><div>Protocol</div><div>Created</div><div>Summary</div><div></div></div>${state.analyses.map((a) => `<div class="tr"><div><div class="rowTitle">${esc(a.situation?.title || a.situationId)}</div><div class="rowMeta">${esc(a.id)}</div></div><div>${esc(a.protocolVersion?.protocol?.name || "—")}</div><div>${fmtDateTime(a.createdAt)}</div><div>${esc((a.summary || "").slice(0, 100))}</div>${button("View", "openAnalysis('" + esc(a.id) + "')")}</div>`).join("")}</div>` : '<div class="empty">No analyses.</div>'}</div><div class="section"><div class="sectionHead"><h2>AI jobs</h2><span class="muted">${state.aiJobs.length}</span></div>${state.aiJobs.length ? `<div class="table"><div class="tr head"><div>Job</div><div>Status</div><div>Minister</div><div>Created</div><div></div></div>${state.aiJobs.map((j) => `<div class="tr"><div>${esc(j.id)}</div><div><span class="status ${statusClass(j.status)}">${esc(j.status)}</span></div><div>${esc(j.user?.name || j.user?.email || "—")}</div><div>${fmtDateTime(j.createdAt)}</div>${button("View", "openAiJob('" + esc(j.id) + "')")}</div>`).join("")}</div>` : '<div class="empty">No AI jobs.</div>'}</div>`
        );
      }
      window.openAnalysis = async (id) => {
        openDrawer();
        const d = document.getElementById("drawer");
        try {
          const a = await getAnalysis(id);
          d.innerHTML = `<div class="drawerHeader"><div><div class="eyebrow">ANALYSIS</div><h2>${esc(a.situation?.title || "Analysis")}</h2></div>${button("Close", "closeDrawer()")}</div><div class="kv"><span>ID</span><span>${esc(a.id)}</span></div><div class="kv"><span>Created</span><span>${fmtDateTime(a.createdAt)}</span></div><div class="kv"><span>Protocol</span><span>${esc(a.protocolVersion?.protocol?.name || "—")} · v${esc(a.protocolVersion?.version || "—")}</span></div><div class="reviewBlock"><h3>Summary</h3><div class="source"><div class="quote">${esc(a.summary || "")}</div></div></div><div class="reviewBlock"><h3>Reasoning</h3><div class="source"><div class="quote">${esc(a.reasoning || "")}</div></div></div><div class="reviewBlock"><h3>Recommendations</h3>${(a.recommendations || []).map((r) => `<div class="version"><b>${esc(r.title)}</b><div>${esc(r.description)}</div></div>`).join("") || '<div class="empty">No recommendations.</div>'}</div></div>`;
        } catch (e) {
          d.innerHTML = `<div class="notice error">${esc(e?.message || "Unable to load analysis.")}</div>`;
        }
      };
      window.openAiJob = async (id) => {
        openDrawer();
        const d = document.getElementById("drawer");
        try {
          const j = await getAiJob(id);
          d.innerHTML = `<div class="drawerHeader"><div><div class="eyebrow">AI JOB</div><h2>${esc(j.id)}</h2></div>${button("Close", "closeDrawer()")}</div><div class="kv"><span>Status</span><span>${esc(j.status)}</span></div><div class="kv"><span>Minister</span><span>${esc(j.user?.name || j.user?.email || "—")}</span></div><div class="kv"><span>Situation</span><span>${esc(j.situation?.title || "—")}</span></div><div class="kv"><span>External job</span><span>${esc(j.externalJobId || "—")}</span></div><div class="reviewBlock"><h3>Result</h3><div class="source"><div class="quote">${esc(prettyJson(j.result))}</div></div></div>${j.errorMessage ? `<div class="notice error">${esc(j.errorMessage)}</div>` : ""}</div>`;
        } catch (e) {
          d.innerHTML = `<div class="notice error">${esc(e?.message || "Unable to load AI job.")}</div>`;
        }
      };

      function usersPage() {
        return (
          header(
            "ADMINISTRATION",
            "Users",
            "System-wide user management. ADMIN only.",
            button("Refresh", "refreshCurrentPage()") +
              button("Create User", "openUserCreate()", true),
          ) +
          `<div class="table">${state.users.length ? `<div class="tr head"><div>User</div><div>Role</div><div>Created</div><div>Activity</div><div></div></div>${state.users.map((u) => `<div class="tr"><div><div class="rowTitle">${esc(u.name)}</div><div class="rowMeta">${esc(u.email)} · ${esc(u.id)}</div></div><div>${esc(u.role)}</div><div>${fmtDate(u.createdAt)}</div><div>${esc(String(u._count?.situations ?? 0))} situations · ${esc(String(u._count?.projects ?? 0))} projects</div>${button("Edit", "openUser('" + esc(u.id) + "')")}</div>`).join("")}` : '<div class="empty"><b>No users</b>No users returned.</div>'}</div>`
        );
      }
      window.openUserCreate = () => {
        openDrawer();
        document.getElementById("drawer").innerHTML =
          `<div class="drawerHeader"><div><div class="eyebrow">USER ADMINISTRATION</div><h2>Create user</h2></div>${button("Close", "closeDrawer()")}</div><form onsubmit="createUserUi(event)"><div class="field"><label>Name</label><input class="search" id="userName" required></div><div class="field"><label>Email</label><input class="search" id="userEmail" type="email" required></div><div class="field"><label>Password</label><input class="search" id="userPassword" type="password" minlength="8" required></div><div class="field"><label>Role</label><select class="select" id="userRole">${USER_ROLES.map((r) => `<option>${r}</option>`).join("")}</select></div><button class="btn primary">Create User</button></form>`;
      };
      window.createUserUi = async (e) => {
        e.preventDefault();
        try {
          await createUser({
            name: document.getElementById("userName").value.trim(),
            email: document.getElementById("userEmail").value.trim(),
            password: document.getElementById("userPassword").value,
            role: document.getElementById("userRole").value,
          });
          toast("User created.");
          await loadAll();
          closeDrawer();
          render();
        } catch (x) {
          toast(x?.message || "Unable to create user.");
        }
      };
      window.openUser = async (id) => {
        openDrawer();
        const d = document.getElementById("drawer");
        try {
          const u = await getUser(id);
          d.innerHTML = `<div class="drawerHeader"><div><div class="eyebrow">USER</div><h2>${esc(u.name)}</h2></div>${button("Close", "closeDrawer()")}</div><div class="kv"><span>Email</span><span>${esc(u.email)}</span></div><div class="kv"><span>Role</span><span>${esc(u.role)}</span></div><div class="reviewBlock"><h3>Edit user</h3><input class="search" id="editUserName" value="${esc(u.name)}"><input class="search" id="editUserEmail" value="${esc(u.email)}"><select class="select" id="editUserRole">${USER_ROLES.map((r) => `<option ${u.role === r ? "selected" : ""}>${r}</option>`).join("")}</select><br>${button("Save changes", "saveUser('" + esc(id) + "')", true)}</div><div class="reviewBlock"><h3>Activity counts</h3><div class="kv"><span>Situations</span><span>${u._count?.situations ?? 0}</span></div><div class="kv"><span>Projects</span><span>${u._count?.projects ?? 0}</span></div><div class="kv"><span>Actions</span><span>${u._count?.actions ?? 0}</span></div><div class="kv"><span>Analyses</span><span>${u._count?.analyses ?? 0}</span></div></div>`;
        } catch (e) {
          d.innerHTML = `<div class="notice error">${esc(e?.message || "Unable to load user.")}</div>`;
        }
      };
      window.saveUser = async (id) => {
        try {
          await updateUser(id, {
            name: document.getElementById("editUserName").value.trim(),
            email: document.getElementById("editUserEmail").value.trim(),
            role: document.getElementById("editUserRole").value,
          });
          toast("User updated.");
          await loadAll();
          await openUser(id);
        } catch (e) {
          toast(e?.message || "Unable to update user.");
        }
      };

      function audit() {
        return (
          header(
            "ADMINISTRATION",
            "Activity / Audit",
            "System-generated audit history returned by the administration API.",
            button("Refresh", "refreshCurrentPage()"),
          ) +
          `<div class="table">${state.auditLogs.length ? `<div class="tr head"><div>Event</div><div>Action</div><div>Entity</div><div>Time</div><div></div></div>${state.auditLogs.map((x) => `<div class="tr"><div><div class="rowTitle">${esc(x.description || "Audit event")}</div><div class="rowMeta">${esc(x.id)}</div></div><div>${esc(x.action || "—")}</div><div>${esc(x.entityType || "—")}</div><div>${fmtDateTime(x.createdAt)}</div>${button("View", "openAudit('" + esc(x.id) + "')")}</div>`).join("")}` : '<div class="empty">No audit activity.</div>'}</div>`
        );
      }
      window.openAudit = async (id) => {
        openDrawer();
        const d = document.getElementById("drawer");
        try {
          const x = await getAuditLog(id);
          d.innerHTML = `<div class="drawerHeader"><div><div class="eyebrow">AUDIT</div><h2>${esc(x.description || "Audit event")}</h2></div>${button("Close", "closeDrawer()")}</div><div class="kv"><span>Action</span><span>${esc(x.action)}</span></div><div class="kv"><span>Entity</span><span>${esc(x.entityType)} · ${esc(x.entityId || "—")}</span></div><div class="kv"><span>User</span><span>${esc(x.user?.name || x.user?.email || x.userId || "—")}</span></div><div class="kv"><span>Created</span><span>${fmtDateTime(x.createdAt)}</span></div><div class="reviewBlock"><h3>Metadata</h3><div class="source"><div class="quote">${esc(prettyJson(x.metadata))}</div></div></div>`;
        } catch (e) {
          d.innerHTML = `<div class="notice error">${esc(e?.message || "Unable to load audit record.")}</div>`;
        }
      };

      function notifications() {
        return (
          header(
            "ACCOUNT",
            "Notifications",
            "Account notifications available to the current administrator.",
            button("Refresh", "refreshCurrentPage()") +
              (state.notifications.length
                ? button("Mark all read", "markAllRead()")
                : ""),
          ) +
          `<div class="notice">${state.unreadNotifications} unread notification(s).</div>${state.notifications.length ? `<div class="table"><div class="tr head"><div>Notification</div><div>Type</div><div>Read</div><div>Created</div><div></div></div>${state.notifications.map((n) => `<div class="tr"><div><div class="rowTitle">${esc(n.title || n.message || "Notification")}</div><div class="rowMeta">${esc(n.id)}</div></div><div>${esc(n.type || "GENERAL")}</div><div>${n.isRead ? "Read" : "Unread"}</div><div>${fmtDateTime(n.createdAt)}</div>${n.isRead ? "<div></div>" : button("Mark read", "markOneRead('" + esc(n.id) + "')")}</div>`).join("")}</div>` : '<div class="empty"><b>No notifications</b>The backend returned no notifications.</div>'}`
        );
      }
      window.markOneRead = async (id) => {
        try {
          await markNotificationAsRead(id);
          toast("Notification marked as read.");
          await loadAll();
          render();
        } catch (e) {
          toast(e?.message || "Unable to mark notification.");
        }
      };
      window.markAllRead = async () => {
        try {
          await markAllNotificationsAsRead();
          toast("Notifications marked as read.");
          await loadAll();
          render();
        } catch (e) {
          toast(e?.message || "Unable to mark notifications.");
        }
      };

      function settings() {
        const s = state.settings || {};
        return (
          header(
            "SYSTEM",
            "Settings",
            "Safe application configuration metadata returned by the administration API.",
            button("Refresh", "refreshCurrentPage()"),
          ) +
          `<div class="detail"><div class="reviewBlock"><h3>Application</h3><div class="kv"><span>Environment</span><span>${esc(s.environment || "—")}</span></div><div class="kv"><span>Port</span><span>${esc(s.port || "—")}</span></div><div class="kv"><span>API base path</span><span>${esc(s.apiBaseUrl || "—")}</span></div><div class="kv"><span>AI service configured</span><span>${s.aiServiceConfigured ? "Yes" : "No"}</span></div><div class="kv"><span>Redis configured</span><span>${s.redisConfigured ? "Yes" : "No"}</span></div></div><div class="reviewBlock"><h3>Supported roles</h3><div class="source"><div class="quote">${esc((s.supportedRoles || []).join(", "))}</div></div></div><div class="reviewBlock"><h3>Supported knowledge types</h3><div class="source"><div class="quote">${esc((s.supportedKnowledgeTypes || []).join(", "))}</div></div></div></div>`
        );
      }

      async function loadAll() {
        state.loading = true;
        clearFail();
        render();
        const adminOnly = user?.role === "ADMIN";
        try {
          const tasks = [
            getAdminDashboard(),
            getDocuments(),
            getKnowledge(),
            getReviews(),
            getProtocols(),
            getVersions(),
            getAnalyses(),
            getAiJobs(),
          ];
          if (adminOnly) tasks.push(getUsers(), getAuditLogs(), getSettings());
          tasks.push(getNotifications(), getUnreadNotificationCount());
          const r = await Promise.allSettled(tasks);
          const val = (i, f) => (r[i].status === "fulfilled" ? r[i].value : f);
          let i = 0;
          state.dashboard = val(i++, null);
          state.documents = val(i++, []);
          state.knowledge = val(i++, []);
          state.reviews = val(i++, []);
          state.protocols = val(i++, []);
          state.versions = val(i++, {
            documents: [],
            protocols: [],
            knowledge: [],
          });
          state.analyses = val(i++, []);
          state.aiJobs = val(i++, []);
          if (adminOnly) {
            state.users = val(i++, []);
            state.auditLogs = val(i++, []);
            state.settings = val(i++, null);
          }
          state.notifications = val(i++, []);
          state.unreadNotifications = Number(val(i++, 0) || 0);
          const rejected = r.find((x) => x.status === "rejected");
          if (rejected) fail(rejected.reason);
        } catch (e) {
          fail(e);
        } finally {
          state.loading = false;
          render();
        }
      }
      window.refreshCurrentPage = async () => {
        await loadAll();
        toast("Administration data refreshed.");
      };
      loadAll();
    </script>
  </body>
</html>
