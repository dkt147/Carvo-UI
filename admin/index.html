<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />

    <title>CARVO — Administration</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,300..700;1,8..60,400&family=Frank+Ruhl+Libre:wght@300..700&display=swap"
      rel="stylesheet"
    />

    <script type="module" src="/src/auth-guard.js"></script>

    <style>
      :root {
        --paper: #fcfcfb;
        --wash: #f9f9f7;
        --ink: #2e2c27;
        --soft: #6b6a63;
        --grey: #b4b3a8;
        --hair: #e4e3dc;
        --clay: #c6613f;
        --clay-h: #ae5133;
        --tint: #f6eae4;
        --green: #68765f;
        --amber: #9a7847;
        --danger: #9c3d32;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: "Source Serif 4", Georgia, serif;
      }

      button,
      input,
      textarea,
      select {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      a {
        text-decoration: none;
        color: inherit;
      }

      .app {
        min-height: 100vh;
      }

      .top {
        height: 58px;
        border-bottom: 1px solid var(--hair);
        display: flex;
        align-items: center;
        padding: 0 26px;
        gap: 18px;
        position: sticky;
        top: 0;
        background: var(--paper);
        z-index: 20;
      }

      .brand {
        font-size: 20px;
        font-weight: 600;
        letter-spacing: 0.16em;
      }

      .role {
        font-size: 11px;
        color: var(--grey);
        letter-spacing: 0.08em;
      }

      .topRight {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .lang {
        border: 1px solid var(--hair);
        background: none;
        border-radius: 7px;
        padding: 5px 11px;
        color: var(--soft);
        font-size: 12px;
      }

      .user {
        padding-left: 12px;
        border-left: 1px solid var(--hair);
        font-size: 13px;
      }

      .layout {
        display: flex;
        min-height: calc(100vh - 58px);
      }

      .side {
        width: 254px;
        border-right: 1px solid var(--hair);
        padding: 26px 12px 20px;
        position: sticky;
        top: 58px;
        height: calc(100vh - 58px);
        overflow: auto;
        flex-shrink: 0;
      }

      .sideIntro {
        padding: 0 12px 26px;
      }

      .sideIntro b {
        font-size: 13px;
        font-weight: 600;
      }

      .sideIntro div {
        font-size: 11px;
        color: var(--grey);
        margin-top: 3px;
      }

      .navGroup {
        margin: 0 0 23px;
      }

      .navLabel {
        font-size: 10px;
        letter-spacing: 0.12em;
        color: var(--grey);
        padding: 0 12px 8px;
      }

      .nav a {
        display: flex;
        justify-content: space-between;
        padding: 8px 12px;
        border-radius: 7px;
        color: var(--soft);
        font-size: 14px;
        margin: 1px 0;
      }

      .nav a:hover,
      .nav a.active {
        background: var(--wash);
        color: var(--ink);
      }

      .nav a.active {
        font-weight: 600;
      }

      .badge {
        color: var(--clay);
        font-size: 11px;
      }

      .main {
        flex: 1;
        min-width: 0;
        padding: 38px 52px 70px;
        max-width: 1450px;
      }

      .eyebrow {
        font-size: 10.5px;
        letter-spacing: 0.12em;
        color: var(--grey);
        text-transform: uppercase;
      }

      .title {
        font-size: 34px;
        line-height: 1.18;
        margin: 7px 0 7px;
        font-weight: 600;
      }

      .sub {
        font-size: 14px;
        color: var(--soft);
        line-height: 1.7;
        max-width: 760px;
      }

      .headRow {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 20px;
        margin-bottom: 30px;
      }

      .actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .btn {
        border: 1px solid var(--hair);
        background: var(--paper);
        border-radius: 7px;
        padding: 9px 14px;
        font-size: 13px;
        color: var(--soft);
      }

      .btn:hover {
        border-color: var(--ink);
        color: var(--ink);
      }

      .btn.primary {
        background: var(--clay);
        border-color: var(--clay);
        color: white;
      }

      .btn.primary:hover {
        background: var(--clay-h);
      }

      .btn:disabled {
        opacity: 0.55;
        cursor: wait;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 1px;
        border-top: 1px solid var(--hair);
        border-bottom: 1px solid var(--hair);
        margin-bottom: 34px;
      }

      .stat {
        padding: 20px 18px;
        border-right: 1px solid var(--hair);
      }

      .stat:last-child {
        border: 0;
      }

      .stat .n {
        font-size: 30px;
      }

      .stat .l {
        font-size: 12px;
        color: var(--soft);
        margin-top: 4px;
      }

      .stat .hint {
        font-size: 11px;
        color: var(--clay);
        margin-top: 7px;
      }

      .section {
        margin: 34px 0;
      }

      .sectionHead {
        display: flex;
        align-items: end;
        justify-content: space-between;
        margin-bottom: 14px;
      }

      .sectionHead h2 {
        font-size: 20px;
        margin: 0;
        font-weight: 600;
      }

      .muted {
        font-size: 12px;
        color: var(--grey);
      }

      .table {
        border-top: 1px solid var(--hair);
      }

      .tr {
        display: grid;
        grid-template-columns: 2.1fr 1.1fr 0.9fr 1fr 90px;
        gap: 18px;
        align-items: center;
        padding: 14px 4px;
        border-bottom: 1px solid var(--hair);
        font-size: 13px;
      }

      .tr.head {
        font-size: 10.5px;
        letter-spacing: 0.08em;
        color: var(--grey);
        text-transform: uppercase;
      }

      .status {
        font-size: 11px;
        padding: 4px 8px;
        border-radius: 20px;
        display: inline-block;
        background: var(--wash);
        color: var(--soft);
      }

      .status.ready {
        color: var(--green);
      }

      .status.review {
        color: var(--clay);
        background: var(--tint);
      }

      .status.processing {
        color: var(--amber);
      }

      .status.failed {
        color: var(--danger);
      }

      .rowTitle {
        font-weight: 600;
      }

      .rowMeta {
        font-size: 11.5px;
        color: var(--grey);
        margin-top: 3px;
      }

      .notice {
        border-inline-start: 3px solid var(--clay);
        background: var(--wash);
        padding: 16px 18px;
        margin: 20px 0;
        font-size: 13px;
        line-height: 1.7;
      }

      .notice.error {
        border-inline-start-color: var(--danger);
        color: var(--danger);
      }

      .notice.success {
        border-inline-start-color: var(--green);
      }

      .source {
        border: 1px solid var(--hair);
        padding: 18px;
        background: var(--paper);
      }

      .source small {
        color: var(--grey);
        font-size: 11px;
      }

      .source strong {
        display: block;
        margin: 6px 0;
      }

      .quote {
        border-left: 2px solid var(--hair);
        padding-left: 14px;
        color: var(--soft);
        line-height: 1.8;
      }

      .cards {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 18px;
      }

      .card {
        border: 1px solid var(--hair);
        padding: 18px;
        background: var(--paper);
      }

      .card h3 {
        margin: 0 0 8px;
        font-size: 16px;
      }

      .card p {
        margin: 0;
        color: var(--soft);
        font-size: 13px;
        line-height: 1.65;
      }

      .toolbar {
        display: flex;
        gap: 9px;
        align-items: center;
        margin-bottom: 14px;
      }

      .search {
        flex: 1;
        border: 1px solid var(--hair);
        border-radius: 7px;
        padding: 9px 12px;
        background: var(--paper);
        font-size: 13px;
        color: var(--ink);
        outline: none;
      }

      .search:focus {
        border-color: var(--clay);
      }

      .select {
        border: 1px solid var(--hair);
        border-radius: 7px;
        padding: 9px 12px;
        background: var(--paper);
        color: var(--soft);
        font-size: 13px;
        outline: none;
      }

      .empty {
        border-top: 1px solid var(--hair);
        border-bottom: 1px solid var(--hair);
        padding: 54px 20px;
        text-align: center;
        color: var(--soft);
      }

      .empty b {
        display: block;
        color: var(--ink);
        font-size: 18px;
        margin-bottom: 7px;
      }

      .detail {
        max-width: 930px;
      }

      .detailGrid {
        display: grid;
        grid-template-columns: 1fr 310px;
        gap: 30px;
      }

      .field {
        margin: 18px 0;
      }

      .field label {
        display: block;
        font-size: 11px;
        letter-spacing: 0.08em;
        color: var(--grey);
        text-transform: uppercase;
        margin-bottom: 7px;
      }

      .textarea {
        width: 100%;
        min-height: 150px;
        border: 1px solid var(--hair);
        border-radius: 7px;
        padding: 12px;
        resize: vertical;
        background: var(--paper);
        line-height: 1.7;
        outline: none;
      }

      .textarea:focus {
        border-color: var(--clay);
      }

      .reviewBlock {
        border-top: 1px solid var(--hair);
        padding: 18px 0;
      }

      .reviewBlock h3 {
        font-size: 17px;
        margin: 0 0 8px;
      }

      .reviewBlock p {
        font-size: 13px;
        line-height: 1.7;
        color: var(--soft);
        margin: 0;
      }

      .sidePanel {
        border-left: 1px solid var(--hair);
        padding-left: 22px;
      }

      .sidePanel h3 {
        font-size: 15px;
        margin-top: 0;
      }

      .kv {
        display: flex;
        justify-content: space-between;
        gap: 15px;
        border-bottom: 1px solid var(--hair);
        padding: 9px 0;
        font-size: 12.5px;
      }

      .kv span:last-child {
        color: var(--soft);
        text-align: right;
        word-break: break-word;
      }

      .loading {
        padding: 34px 4px;
        color: var(--soft);
        font-size: 13px;
      }

      .loading::before {
        content: "";
        display: inline-block;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--clay);
        margin-right: 8px;
        animation: pulse 1s infinite alternate;
      }

      @keyframes pulse {
        from {
          opacity: 0.3;
        }

        to {
          opacity: 1;
        }
      }

      .toast {
        position: fixed;
        right: 22px;
        bottom: 22px;
        background: var(--ink);
        color: var(--paper);
        padding: 11px 15px;
        border-radius: 7px;
        font-size: 12.5px;
        opacity: 0;
        transform: translateY(8px);
        pointer-events: none;
        transition: 0.2s;
        z-index: 100;
        max-width: 360px;
      }

      .toast.show {
        opacity: 1;
        transform: none;
      }

      .overlay {
        position: fixed;
        inset: 0;
        background: rgba(46, 44, 39, 0.18);
        z-index: 50;
        display: none;
      }

      .drawer {
        position: absolute;
        right: 0;
        top: 0;
        height: 100%;
        width: min(620px, 94vw);
        background: var(--paper);
        padding: 28px;
        overflow: auto;
        border-left: 1px solid var(--hair);
      }

      .overlay.open {
        display: block;
      }

      .drawerHeader {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 20px;
        margin-bottom: 24px;
      }

      .drawerHeader h2 {
        margin: 5px 0;
        font-size: 25px;
      }

      .version {
        border: 1px solid var(--hair);
        padding: 14px;
        margin-top: 12px;
      }

      .versionTitle {
        font-weight: 600;
        font-size: 14px;
      }

      .versionMeta {
        color: var(--grey);
        font-size: 11px;
        margin-top: 4px;
      }

      .versionContent {
        color: var(--soft);
        font-size: 13px;
        line-height: 1.7;
        margin-top: 12px;
        white-space: pre-wrap;
      }

      .fileInput {
        width: 100%;
        border: 1px dashed var(--hair);
        padding: 18px;
        border-radius: 7px;
        background: var(--wash);
      }

      .fileInput input {
        width: 100%;
        margin-top: 10px;
      }

      @media (max-width: 1000px) {
        .side {
          width: 220px;
        }

        .main {
          padding: 30px;
        }

        .grid {
          grid-template-columns: repeat(2, 1fr);
        }

        .cards {
          grid-template-columns: 1fr 1fr;
        }

        .detailGrid {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 720px) {
        .side {
          display: none;
        }

        .main {
          padding: 24px 18px;
        }

        .grid,
        .cards {
          grid-template-columns: 1fr;
        }

        .tr {
          grid-template-columns: 1.5fr 0.8fr 80px;
        }

        .tr > *:nth-child(3),
        .tr > *:nth-child(4) {
          display: none;
        }

        .top {
          padding: 0 16px;
        }

        .user {
          display: none;
        }

        .headRow {
          display: block;
        }

        .actions {
          margin-top: 15px;
        }

        .toolbar {
          flex-direction: column;
          align-items: stretch;
        }
      }
    </style>
  </head>

  <body>
    <div id="app"></div>

    <div id="toast" class="toast"></div>

    <div id="overlay" class="overlay" onclick="closeDrawer()">
      <div id="drawer" class="drawer" onclick="event.stopPropagation()"></div>
    </div>

    <script type="module">
      import {
        getAdminDashboardData,
        getDocuments,
        getDocument,
        createDocument,
        getKnowledge,
        getProtocols,
        getAuditLogs,
        getNotifications,
        getUnreadNotificationCount,
        markNotificationAsRead,
        markAllNotificationsAsRead,
      } from "/src/api/admin.api.js";

      import { getCurrentUser } from "/src/api/client.js";

      const state = {
        page: "dashboard",
        search: "",
        docStatus: "ALL",
        loading: false,
        documents: [],
        knowledge: [],
        protocols: [],
        auditLogs: [],
        notifications: [],
        unreadNotifications: 0,
        error: "",
      };

      const user = getCurrentUser();

      /* ---------------------------------------------------------------------- */
      /* Utilities                                                              */
      /* ---------------------------------------------------------------------- */

      function esc(value) {
        return String(value ?? "").replace(
          /[&<>"']/g,
          (match) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#039;",
            })[match],
        );
      }

      function formatDate(value) {
        if (!value) {
          return "—";
        }

        const date = new Date(value);

        if (Number.isNaN(date.getTime())) {
          return String(value);
        }

        return date.toLocaleDateString(undefined, {
          year: "numeric",
          month: "short",
          day: "numeric",
        });
      }

      function formatDateTime(value) {
        if (!value) {
          return "—";
        }

        const date = new Date(value);

        if (Number.isNaN(date.getTime())) {
          return String(value);
        }

        return date.toLocaleString(undefined, {
          year: "numeric",
          month: "short",
          day: "numeric",
          hour: "2-digit",
          minute: "2-digit",
        });
      }

      function statusClass(status) {
        const value = String(status || "").toUpperCase();

        if (value === "PROCESSING" || value === "QUEUED") {
          return "processing";
        }

        if (value === "FAILED" || value === "CANCELLED") {
          return "failed";
        }

        if (value === "REVIEW" || value === "DRAFT" || value === "PENDING") {
          return "review";
        }

        return "ready";
      }

      function safeStatus(status) {
        return String(status || "UNKNOWN").toUpperCase();
      }

      function showToast(message) {
        const toast = document.getElementById("toast");

        toast.textContent = message;
        toast.classList.add("show");

        window.clearTimeout(window.__carvoToastTimer);

        window.__carvoToastTimer = window.setTimeout(
          () => toast.classList.remove("show"),
          2600,
        );
      }

      function setError(error) {
        state.error = error?.message || "Unable to load the requested data.";

        console.error("[CARVO Admin]", error);
      }

      function clearError() {
        state.error = "";
      }

      /* ---------------------------------------------------------------------- */
      /* Navigation                                                             */
      /* ---------------------------------------------------------------------- */

      function go(page) {
        state.page = page;
        state.search = "";
        state.docStatus = "ALL";
        state.error = "";

        render();

        window.scrollTo({
          top: 0,
          behavior: "smooth",
        });
      }

      window.go = go;

      function nav() {
        return [
          ["MAIN", "Dashboard", "dashboard"],

          ["KNOWLEDGE", "Documents", "documents"],

          ["", "Upload Knowledge", "upload"],

          ["", "AI Reviews", "reviews"],

          ["", "Protocols", "protocols"],

          ["", "Versions", "versions"],

          ["WORK", "Analyses", "analyses"],

          ["ADMINISTRATION", "Users", "users"],

          ["", "Activity / Audit", "audit"],

          ["", "Notifications", "notifications"],

          ["SYSTEM", "Settings", "settings"],
        ];
      }

      function groupedNav() {
        let lastGroup = null;
        let output = "";

        nav().forEach(([group, label, id]) => {
          if (group && group !== lastGroup) {
            if (lastGroup) {
              output += "</div>";
            }

            output += `
              <div class="navGroup">
                <div class="navLabel">
                  ${esc(group)}
                </div>
            `;

            lastGroup = group;
          }

          const badge =
            id === "notifications" && state.unreadNotifications > 0
              ? `<span class="badge">${state.unreadNotifications}</span>`
              : "";

          output += `
            <a
              href="#"
              class="${state.page === id ? "active" : ""}"
              onclick="
                go('${id}');
                return false;
              "
            >
              <span>${esc(label)}</span>
              ${badge}
            </a>
          `;
        });

        if (lastGroup) {
          output += "</div>";
        }

        return output;
      }

      /* ---------------------------------------------------------------------- */
      /* Shell                                                                   */
      /* ---------------------------------------------------------------------- */

      function render() {
        const name = user?.name || user?.email || "Administrator";

        const role = user?.role || "ADMIN";

        document.getElementById("app").innerHTML = `
        <div class="app">

          <header class="top">

            <div class="brand">
              CARVO
            </div>

            <div class="role">
              ADMINISTRATION ·
              ${esc(role)}
            </div>

            <div class="topRight">

              <button
                class="lang"
                type="button"
              >
                עברית
              </button>

              <button
                class="lang"
                type="button"
              >
                English
              </button>

              <div class="user">
                ${esc(name)}
                ·
                ${esc(role)}
              </div>

            </div>

          </header>

          <div class="layout">

            <aside class="side">

              <div class="sideIntro">
                <b>
                  Knowledge · Analysis · Action
                </b>

                <div>
                  Phase 1 administration
                </div>
              </div>

              <nav class="nav">
                ${groupedNav()}
              </nav>

            </aside>

            <main class="main">
              ${page()}
            </main>

          </div>

        </div>
      `;
      }

      function header(eyebrow, title, description, actions = "") {
        return `
        <div class="headRow">

          <div>

            <div class="eyebrow">
              ${esc(eyebrow)}
            </div>

            <h1 class="title">
              ${esc(title)}
            </h1>

            <div class="sub">
              ${esc(description)}
            </div>

          </div>

          <div class="actions">
            ${actions}
          </div>

        </div>
      `;
      }

      function page() {
        switch (state.page) {
          case "dashboard":
            return dashboard();

          case "documents":
            return documents();

          case "upload":
            return upload();

          case "reviews":
            return reviews();

          case "review-detail":
            return reviewDetail();

          case "clarification":
            return clarification();

          case "approval":
            return approval();

          case "protocols":
            return protocolsPage();

          case "protocol-detail":
            return protocolDetail();

          case "versions":
            return versions();

          case "analyses":
            return analysesPage();

          case "users":
            return usersPage();

          case "audit":
            return audit();

          case "notifications":
            return notifications();

          case "settings":
            return settings();

          default:
            return dashboard();
        }
      }

      function errorNotice() {
        if (!state.error) {
          return "";
        }

        return `
        <div class="notice error">
          <strong>
            Unable to load live data
          </strong>

          <div style="margin-top:5px">
            ${esc(state.error)}
          </div>

          <div style="margin-top:12px">
            <button
              class="btn"
              type="button"
              onclick="refreshCurrentPage()"
            >
              Try again
            </button>
          </div>
        </div>
      `;
      }

      /* ---------------------------------------------------------------------- */
      /* Dashboard                                                               */
      /* ---------------------------------------------------------------------- */

      function dashboard() {
        const stats = state.dashboardStats || {
          totalDocuments: 0,
          processingDocuments: 0,
          processedDocuments: 0,
          approvedDocuments: 0,
          totalKnowledge: 0,
          activeProtocols: 0,
          totalProtocols: 0,
          unreadNotifications: 0,
        };

        const recentAudit = state.auditLogs.slice(0, 5);

        return (
          header(
            "ADMIN DASHBOARD",
            "Knowledge administration",
            "Review the knowledge pipeline, approved protocols and recent system activity.",
            `
            <button
              class="btn primary"
              type="button"

      window.submitDocument = async function submitDocument(event) {
        event.preventDefault();

        const title = document.getElementById("documentTitle").value.trim();

        const description = document
          .getElementById("documentDescription")
          .value.trim();

        const fileName = document
          .getElementById("documentFileName")
          .value.trim();

        const fileUrl = document.getElementById("documentFileUrl").value.trim();

        const errorBox = document.getElementById("uploadError");

        const button = document.getElementById("uploadButton");

        errorBox.style.display = "none";

        if (!title || !fileName) {
          errorBox.textContent = "Document title and file name are required.";

          errorBox.style.display = "block";

          return;
        }

        button.disabled = true;
        button.textContent = "Creating…";

        try {
          await createDocument({
            title,
            description: description || undefined,
            fileName,
            fileUrl: fileUrl || undefined,
          });

          showToast("Document created successfully.");

          await loadAdminData();

          state.page = "documents";

          render();
        } catch (error) {
          errorBox.textContent = error?.message || "Unable to create document.";

          errorBox.style.display = "block";

          console.error("[CARVO Upload]", error);
        } finally {
          button.disabled = false;
          button.textContent = "Create Document";
        }
      };

                      (row) => `
                        <div class="tr">

                          <div class="rowTitle">
                            ${esc(row.entity)}
                          </div>

                          <div>
                            ${esc(row.entityType)}
                          </div>

                          <div>
                            v${esc(row.version)}
                          </div>

                          <div>
                            ${formatDateTime(row.createdAt)}
                          </div>

                          <div></div>

                        </div>
                      `,
                    )
                    .join("")}

                </div>
              `
              : `
                <div class="empty">

                  <b>
                    No versions available
                  </b>

                  No protocol versions were
                  returned by the backend.

                </div>
              `
          }
        `
        );
      }

      function analysesPage() {
        return (
          header(
            "WORK",
            "Analyses",
            "Analysis administration will be connected to the existing situation and analysis APIs in the analysis module.",
          ) +
          `
          <div class="notice">

            The current Module 2 scope focuses on
            the Admin dashboard and document library.
            Analysis integration will be handled in
            the dedicated analysis module.

          </div>
        `
        );
      }

      function usersPage() {
        return (
          header(
            "ADMINISTRATION",
            "Users",
            "User administration will be connected in the dedicated users module.",
          ) +
          `
          <div class="notice">

            The current backend already provides
            ADMIN-only user endpoints. We will connect
            the complete user-management workflow in
            its own module so authentication remains stable.

          </div>
        `
        );
      }

      function audit() {
        return (
          header(
            "ADMINISTRATION",
            "Activity / Audit",
            "System-generated audit history returned by the CARVO backend.",
          ) +
          `
          ${
            state.auditLogs.length
              ? `
                <div class="table">

                  <div class="tr head">

                    <div>
                      Event
                    </div>

                    <div>
                      Action
                    </div>

                    <div>
                      Entity
                    </div>

                    <div>
                      Time
                    </div>

                    <div></div>

                  </div>

                  ${state.auditLogs
                    .map(
                      (item) => `
                        <div class="tr">

                          <div>
                            <div class="rowTitle">
                              ${esc(item.description || "Audit event")}
                            </div>

                            <div class="rowMeta">
                              ${esc(item.id || "")}
                            </div>
                          </div>

                          <div>
                            ${esc(item.action || "—")}
                          </div>

                          <div>
                            ${esc(item.entityType || "—")}
                          </div>

                          <div>
                            ${formatDateTime(item.createdAt)}
                          </div>

                          <button
                            class="btn"
                            type="button"
                            onclick="
                              openAudit(
                                '${esc(item.id)}',
                              )
                            "
                          >
                            View
                          </button>

                        </div>
                      `,
                    )
                    .join("")}

                </div>
              `
              : `
                <div class="empty">

                  <b>
                    No audit activity
                  </b>

                  No audit records were returned
                  for this account.

                </div>
              `
          }
        `
        );
      }

      window.openAudit = async function openAudit(auditId) {
        const item = state.auditLogs.find(
          (log) => String(log.id) === String(auditId),
        );

        if (!item) {
          showToast("Audit record not found.");

          return;
        }

        document.getElementById("drawer").innerHTML = `
          <div class="drawerHeader">

            <div>

              <div class="eyebrow">
                AUDIT
              </div>

              <h2>
                ${esc(item.description || "Audit event")}
              </h2>

            </div>

            <button
              class="btn"
              type="button"
              onclick="closeDrawer()"
            >
              Close
            </button>

          </div>

          <div class="kv">
            <span>
              ID
            </span>

            <span>
              ${esc(item.id)}
            </span>
          </div>

          <div class="kv">
            <span>
              Action
            </span>

            <span>
              ${esc(item.action || "—")}
            </span>
          </div>

          <div class="kv">
            <span>
              Entity
            </span>

            <span>
              ${esc(item.entityType || "—")}
            </span>
          </div>

          <div class="kv">
            <span>
              Entity ID
            </span>

            <span>
              ${esc(item.entityId || "—")}
            </span>
          </div>

          <div class="kv">
            <span>
              User
            </span>

            <span>
              ${esc(item.userId || "—")}
            </span>
          </div>

          <div class="kv">
            <span>
              Created
            </span>

            <span>
              ${formatDateTime(item.createdAt)}
            </span>
          </div>

          ${
            item.metadata
              ? `
                <div class="reviewBlock">

                  <h3>
                    Metadata
                  </h3>

                  <div class="source">
                    <div class="quote">
                      ${esc(JSON.stringify(item.metadata, null, 2))}
                    </div>
                  </div>

                </div>
              `
              : ""
          }
        `;

        openDrawer();
      };

      function notifications() {
        return (
          header(
            "ACCOUNT",
            "Notifications",
            "Notifications returned by the CARVO backend for the current administrator.",
            `
            ${
              state.notifications.length
                ? `
                  <button
                    class="btn"
                    type="button"
                    onclick="markAllRead()"
                  >
                    Mark all read
                  </button>
                `
                : ""
            }

            <button
              class="btn"
              type="button"
              onclick="refreshCurrentPage()"
            >
              Refresh
            </button>
          `,
          ) +
          `
          ${
            state.unreadNotifications > 0
              ? `
                <div class="notice">
                  ${state.unreadNotifications}
                  unread notification${
                    state.unreadNotifications === 1 ? "" : "s"
                  }.
                </div>
              `
              : `
                <div class="notice success">
                  No unread notifications.
                </div>
              `
          }

          ${
            state.notifications.length
              ? `
                <div class="table">

                  <div class="tr head">

                    <div>
                      Notification
                    </div>

                    <div>
                      Type
                    </div>

                    <div>
                      Read
                    </div>

                    <div>
                      Created
                    </div>

                    <div></div>

                  </div>

                  ${state.notifications
                    .map(
                      (notification) => `
                        <div class="tr">

                          <div>

                            <div class="rowTitle">
                              ${esc(
                                notification.title ||
                                  notification.message ||
                                  "Notification",
                              )}
                            </div>

                            <div class="rowMeta">
                              ${esc(notification.id || "")}
                            </div>

                          </div>

                          <div>
                            ${esc(notification.type || "GENERAL")}
                          </div>

                          <div>
                            ${notification.isRead ? "Read" : "Unread"}
                          </div>

                          <div>
                            ${formatDateTime(notification.createdAt)}
                          </div>

                          ${
                            notification.isRead
                              ? `
                                <div></div>
                              `
                              : `
                                <button
                                  class="btn"
                                  type="button"
                                  onclick="
                                    markOneRead(
                                      '${esc(notification.id)}',
                                    )
                                  "
                                >
                                  Mark read
                                </button>
                              `
                          }

                        </div>
                      `,
                    )
                    .join("")}

                </div>
              `
              : `
                <div class="empty">

                  <b>
                    No notifications
                  </b>

                  The backend returned no
                  notifications for this account.

                </div>
              `
          }
        `
        );
      }

      window.markOneRead = async function markOneRead(notificationId) {
        try {
          await markNotificationAsRead(notificationId);

          showToast("Notification marked as read.");

          await loadAdminData();

          render();
        } catch (error) {
          showToast(error?.message || "Unable to mark notification as read.");
        }
      };

      window.markAllRead = async function markAllRead() {
        try {
          await markAllNotificationsAsRead();

          showToast("All notifications marked as read.");

          await loadAdminData();

          render();
        } catch (error) {
          showToast(error?.message || "Unable to mark notifications as read.");
        }
      };

      function settings() {
        return (
          header(
            "SYSTEM",
            "Settings",
            "Application-level settings and account information.",
          ) +
          `
          <div class="detail">

            <div class="reviewBlock">

              <h3>
                Application
              </h3>

              <div class="kv">
                <span>
                  Environment
                </span>

                <span>
                  Development
                </span>
              </div>

              <div class="kv">
                <span>
                  API
                </span>

                <span>
                  ${esc(import.meta.env.VITE_API_URL || "Not configured")}
                </span>
              </div>

              <div class="kv">
                <span>
                  Role
                </span>

                <span>
                  ${esc(user?.role || "—")}
                </span>
              </div>

            </div>

            <div class="reviewBlock">

              <h3>
                Account
              </h3>

              <div class="kv">
                <span>
                  Name
                </span>

                <span>
                  ${esc(user?.name || "—")}
                </span>
              </div>

              <div class="kv">
                <span>
                  Email
                </span>

                <span>
                  ${esc(user?.email || "—")}
                </span>
              </div>

            </div>

          </div>
        `
        );
      }

      /* ---------------------------------------------------------------------- */
      /* Drawer                                                                  */
      /* ---------------------------------------------------------------------- */

      window.openDrawer = function openDrawer() {
        document.getElementById("overlay").classList.add("open");
      };

      window.closeDrawer = function closeDrawer() {
        document.getElementById("overlay").classList.remove("open");
      };

      /* ---------------------------------------------------------------------- */
      /* API loading                                                             */
      /* ---------------------------------------------------------------------- */

      async function loadAdminData() {
        state.loading = true;
        state.error = "";

        render();

        try {
          const dashboard = await getAdminDashboardData();

          state.documents = dashboard.documents || [];

          state.knowledge = dashboard.knowledge || [];

          state.protocols = dashboard.protocols || [];

          state.auditLogs = dashboard.auditLogs || [];

          state.unreadNotifications = Number(
            dashboard.unreadNotifications || 0,
          );

          state.dashboardStats = dashboard.stats || {};

          /*
           * Notifications are loaded separately.
           * If the endpoint fails, the dashboard data
           * should still remain usable.
           */
          try {
            state.notifications = await getNotifications();
          } catch (notificationError) {
            console.warn("[CARVO Notifications]", notificationError);

            state.notifications = [];
          }

          clearError();
        } catch (error) {
          setError(error);
        } finally {
          state.loading = false;

          render();
        }
      }

      window.refreshCurrentPage = async function refreshCurrentPage() {
        await loadAdminData();

        showToast("Administration data refreshed.");
      };

      /* ---------------------------------------------------------------------- */
      /* Initial load                                                            */
      /* ---------------------------------------------------------------------- */

      loadAdminData();
    </script>
  </body>
</html>
